<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Temblor</title>
</head>
<body>

    <h1>Registrar Evento Sísmico</h1>

    <form method="POST" action="{% url 'resultado' %}">
        {% csrf_token %}

        <h3>Información del Temblor</h3>
        <div>
            <label for="magnitud">Magnitud:</label>
            <input type="number" id="magnitud" name="magnitud" step="0.1" min="0" placeholder="Ej. 5.6" required>
        </div>

        <div>
            <label for="lugar">Lugar / Epicentro:</label>
            <input type="text" id="lugar" name="lugar" placeholder="Ej. Popayán, Cauca" required>
        </div>

        <!-- RELACIÓN 1-N: Selección del Departamento -->
        <div>
            <label for="departamento">Departamento (Relación 1-N):</label>
            <select id="departamento" name="departamento_id" required>
                <option value="" disabled selected>Selecciona un departamento</option>
                {% for d in departamentos %}
                    <option value="{{ d.id }}">{{ d.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" name="fecha" required>
        </div>

        <div>
            <label for="hora">Hora:</label>
            <input type="time" id="hora" name="hora" required>
        </div>

        <div>
            <label for="profundidad">Profundidad (km):</label>
            <input type="number" id="profundidad" name="profundidad" step="0.1" min="0" placeholder="Ej. 35.5" required>
        </div>

        <div>
            <label for="rango_profundidad">Rango de Profundidad:</label>
            <select id="rango_profundidad" name="rango_profundidad" required>
                <option value="" disabled selected>Selecciona un rango</option>
                <option value="Superficial">Superficial (&lt; 30 km)</option>
                <option value="Intermedio">Intermedio (30 - 120 km)</option>
                <option value="Profundo">Profundo (&gt; 120 km)</option>
            </select>
        </div>

        <hr>
        <h3>Reporte de Daños (Relación 1-1)</h3>
        <div>
            <label for="afectados">Número de personas afectadas:</label>
            <input type="number" id="afectados" name="afectados" min="0" value="0">
        </div>

        <div>
            <label for="descripcion_danios">Descripción de daños:</label>
            <textarea id="descripcion_danios" name="descripcion_danios" placeholder="Detalles de afectaciones..."></textarea>
        </div>

        <br>
        <button type="submit">Guardar en Base de Datos</button>
    </form>

    <hr>

    <h3>Buscar por ID o Lugar</h3>
    <form method="GET" action="{% url 'buscar_temblor' %}">
        <input type="text" name="busqueda" placeholder="Ingrese ID o Lugar..." required>
        <button type="submit">Buscar por Texto/ID</button>
    </form>

    <br>

    <h3>Buscar por Fecha y Hora</h3>
    <form method="GET" action="{% url 'buscar_temblor' %}">
        <label for="fecha_busqueda">Fecha:</label>
        <input type="date" id="fecha_busqueda" name="fecha_busqueda" required>

        <label for="hora_busqueda">Hora (Opcional):</label>
        <input type="time" id="hora_busqueda" name="hora_busqueda">

        <button type="submit">Buscar por Fecha/Hora</button>
    </form>

    <br><hr><br>

    <a href="{% url 'lista_temblores' %}">
        <button type="button">Ver Todos los Temblores Guardados</button>
    </a>

</body>
</html>
